# Default values for eump chart.
# Common multi-environment baseline. Use values-dev.yaml and values-prod.yaml for environment overrides.

environment: dev

azureKeyVault:
  name: kv-eump-dev
  tenantId: "6941c60f-c45a-44be-b714-9c5587e240c0"
  userAssignedIdentityID: "5e9f1ed2-30e1-4348-8f48-a67367a5626e"
  cloudName: ""

backend:
  replicaCount: 1
  image:
    repository: acreump100.azurecr.io/eump-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5100
    targetPort: 5100
  config:
    aspnetcoreEnvironment: Development
    aspnetcoreUrls: "http://+:5100"
    applyMigrationsOnStartup: "true"
    enableSwagger: "true"
    enableHttpsRedirection: "false"
    forwardedHeadersEnabled: "true"
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 20
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  startupProbe:
    enabled: false
  podSecurityContext: {}
  securityContext: {}
  terminationGracePeriodSeconds: 60

frontend:
  replicaCount: 1
  image:
    repository: acreump100.azurecr.io/eump-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: LoadBalancer
    port: 80
    targetPort: 80
    annotations: {}
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 150m
      memory: 128Mi
  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 15
    timeoutSeconds: 3
    failureThreshold: 3
  readinessProbe:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 3
    failureThreshold: 3
  podSecurityContext: {}
  securityContext: {}
  terminationGracePeriodSeconds: 30

autoscaling:
  enabled: true
  backend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  frontend:
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

ingress:
  enabled: false
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
  hosts:
    - host: dev.eump.contoso.com
  tls: []

networkPolicy:
  enabled: false

podDisruptionBudget:
  enabled: false

migrationJob:
  enabled: false
