apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-eump-secret-provider
  labels:
    {{- include "eump.labels" . | nindent 4 }}
spec:
  provider: azure
  secretObjects:
    - secretName: eump-secret
      type: Opaque
      data:
        - objectName: SqlConnectionString
          key: ConnectionStrings__DefaultConnection
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.azureKeyVault.userAssignedIdentityID | quote }}
    keyvaultName: {{ .Values.azureKeyVault.name | quote }}
    cloudName: {{ .Values.azureKeyVault.cloudName | default "" | quote }}
    objects: |
      array:
        - |
          objectName: SqlConnectionString
          objectType: secret
          objectVersion: ""
    tenantId: {{ .Values.azureKeyVault.tenantId | quote }}
