apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    {{- include "eump.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: {{ .Values.backend.service.port | default 5100 }}
      targetPort: {{ .Values.backend.service.targetPort | default 5100 }}
      protocol: TCP
