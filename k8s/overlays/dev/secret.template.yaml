# NOTE: Do NOT commit real passwords or production secrets to Git.
# When using Azure Key Vault CSI Driver (azure-kv-eump-secret-provider), the driver automatically
# mounts and synchronizes "SqlConnectionString" from Azure Key Vault into the "eump-secret" Kubernetes Secret.
#
# If you need to seed or provide the secret manually before mounting:
# kubectl create secret generic eump-secret \
#   --from-literal=ConnectionStrings__DefaultConnection="<DEV_SQL_CONNECTION_STRING>" \
#   --from-literal=API_SECRET_KEY="<DEV_JWT_SECRET>" \
#   -n dev --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: eump-secret
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
    environment: dev
type: Opaque
stringData:
  API_SECRET_KEY: "replace-with-dev-jwt-secret-or-kv"
  ConnectionStrings__DefaultConnection: "Server=tcp:eump-sql-dev.database.windows.net,1433;Initial Catalog=enterprise-user-db-dev;Persist Security Info=False;User ID=sqladmin;Password=<DEV_SECRET_FROM_KEY_VAULT>;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

