apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-eump-secret-provider
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
    environment: dev
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "5e9f1ed2-30e1-4348-8f48-a67367a5626e"
    keyvaultName: "kv-eump-dev"
    cloudName: ""              # Defaults to AzurePublicCloud
    objects: |
      array:
        - |
          objectName: SqlConnectionString
          objectType: secret
          objectVersion: ""
    tenantId: "6941c60f-c45a-44be-b714-9c5587e240c0"
  secretObjects:
    - secretName: eump-secret
      type: Opaque
      data:
        - key: ConnectionStrings__DefaultConnection
          objectName: SqlConnectionString

