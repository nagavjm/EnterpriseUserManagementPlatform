apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eump-ingress
spec:
  rules:
    - host: dev.eump.contoso.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

