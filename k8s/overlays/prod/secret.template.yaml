# NOTE: NEVER commit real production passwords or credentials to Git!
# Azure Key Vault CSI Driver (azure-kv-eump-secret-provider) synchronizes "SqlConnectionString"
# from Azure Key Vault (kv-eump-prod) into the "eump-secret" Kubernetes Secret.
#
# To create the secret out-of-band via Azure CLI / pipeline:
# kubectl create secret generic eump-secret \
#   --from-literal=ConnectionStrings__DefaultConnection="<PROD_SQL_CONNECTION_STRING_FROM_KEY_VAULT>" \
#   --from-literal=API_SECRET_KEY="<PROD_JWT_SECRET_FROM_KEY_VAULT>" \
#   -n prod --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: eump-secret
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
    environment: prod
type: Opaque
stringData:
  API_SECRET_KEY: "replace-with-prod-jwt-secret-from-key-vault"
  ConnectionStrings__DefaultConnection: "Server=tcp:eump-sql-prod.database.windows.net,1433;Initial Catalog=enterprise-user-db-prod;Persist Security Info=False;User ID=sqladmin;Password=<PROD_SECRET_FROM_KEY_VAULT>;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"

