apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eump-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - eump.contoso.com
      secretName: eump-prod-tls
  rules:
    - host: eump.contoso.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

