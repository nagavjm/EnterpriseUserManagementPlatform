apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eump-ingress
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: eump.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

