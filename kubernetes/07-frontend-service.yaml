apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: eump
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eump
spec:
  # Using LoadBalancer allows direct local access in Docker Desktop (localhost:80),
  # Minikube (minikube tunnel), or cloud providers (AWS ELB / GCP Cloud LB / Azure LB).
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP

