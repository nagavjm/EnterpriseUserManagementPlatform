apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eump
spec:
  # With Azure SQL Database persistence and EF Core, the backend is stateless
  # and can safely scale across multiple pod replicas with zero downtime rolling updates.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-user-management-platform
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-user-management-platform
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: eump
    spec:
      containers:
        - name: backend
          # For AKS, tag and push to your Azure Container Registry: <acrName>.azurecr.io/eump-backend:latest
          # Azure DevOps CI/CD pipeline dynamically injects $(acrLoginServer)/eump-backend:$(Build.BuildId).
          image: eump-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5100
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: eump-config
            - secretRef:
                name: eump-secret
          volumeMounts:
            # Mounting the Secrets Store CSI volume triggers the driver to fetch the
            # SqlConnectionString from Azure Key Vault and synchronize it into eump-secret.
            - name: secrets-store-inline
              mountPath: "/mnt/secrets-store"
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # Kubernetes Liveness Probe: verifies that the .NET 9 Kestrel process is alive
          livenessProbe:
            httpGet:
              path: /health
              port: 5100
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          # Kubernetes Readiness Probe: verifies that Azure SQL database connectivity is healthy
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 5100
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "azure-kv-eump-secret-provider"
