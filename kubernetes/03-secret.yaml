apiVersion: v1
kind: Secret
metadata:
  name: eump-secret
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
type: Opaque
stringData:
  # Secret placeholders for non-vault fallback configuration (e.g. JWT secrets, API tokens)
  API_SECRET_KEY: "enterprise-user-management-secret-key-placeholder"
  # Note: ConnectionStrings__DefaultConnection is dynamically fetched and synced
  # from Azure Key Vault by the Secrets Store CSI Driver (03-secret-provider-class.yaml).
