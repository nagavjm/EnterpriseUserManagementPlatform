apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-eump-secret-provider
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    # When useVMManagedIdentity is true, Secrets Store CSI driver authenticates to Key Vault
    # using the AKS cluster's Kubelet Managed Identity without needing any credentials in Kubernetes.
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ""         # Leave empty when using system-assigned Kubelet identity
    keyvaultName: "kv-eump-nagarajan"  # Your Azure Key Vault name
    cloudName: ""                     # Defaults to AzurePublicCloud
    objects: |
      array:
        - |
          objectName: SqlConnectionString
          objectType: secret
          objectVersion: ""
    tenantId: ""                      # Azure Tenant ID (injected by pipeline or set directly)
  # Synchronize the retrieved Azure Key Vault secret into a native Kubernetes Secret
  secretObjects:
    - secretName: eump-secret
      type: Opaque
      data:
        - key: ConnectionStrings__DefaultConnection
          objectName: SqlConnectionString
