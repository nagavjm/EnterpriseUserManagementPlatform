# Persistent Volume Claim for Physical JSON Data Store
# In Azure Kubernetes Service (AKS):
#   - Default storage class is 'managed-csi' (Azure Managed Disk, ReadWriteOnce).
#   - Minimum recommended disk size for Azure Managed Disks is 5Gi.
#   - For shared multi-pod or instant node-failover storage, 'azurefile-csi' can also be used.
# Omitting storageClassName leverages AKS's default dynamic StorageClass ('managed-csi').
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eump-storage-pvc
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: eump
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

