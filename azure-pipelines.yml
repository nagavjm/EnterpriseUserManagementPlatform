# ===============================================================================
# Azure DevOps CI/CD Pipeline - Enterprise User Management Platform (EUMP)
# Target Environments: Dev (eump-dev) -> Prod (eump-prod) on AKS
# Standards: Multi-stage, Quality Gates, Immutable Build IDs, Environment Promotion
# ===============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**
      - .vscode/**
      - .gitignore

pr:
  branches:
    include:
      - main

variables:
  # ---------------------------------------------------------------------------
  # Azure DevOps Service Connection & Azure Resources Configuration
  # ---------------------------------------------------------------------------
  azureServiceConnection: 'azure-rm-connection' # ARM Service Connection name in Azure DevOps
  acrName: 'acreump1001'                        # Azure Container Registry name (without .azurecr.io)
  acrLoginServer: '$(acrName).azurecr.io'       # e.g., acreump1001.azurecr.io

  # Dev Environment Target Settings
  devResourceGroup: 'rg-eump'                   # Dev Azure Resource Group
  devAksCluster: 'aks-eump'                     # Dev AKS Cluster name
  devNamespace: 'eump-dev'                      # Isolated Dev Kubernetes Namespace

  # Prod Environment Target Settings
  prodResourceGroup: 'rg-eump'                  # Prod Azure Resource Group (same or separate)
  prodAksCluster: 'aks-eump'                    # Prod AKS Cluster name (same or separate)
  prodNamespace: 'eump-prod'                    # Isolated Prod Kubernetes Namespace

  # Build Configuration
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'
  nodeVersion: '20.x'
  tag: '$(Build.BuildId)'                       # Immutable unique image tag per build

pool:
  vmImage: 'ubuntu-latest'

# ===============================================================================
# STAGE 1: CONTINUOUS INTEGRATION (CI)
# - Parallel Backend (.NET 9) and Frontend (Angular 19) Validation
# - Code Quality, Unit/Integration Tests Reporting & Coverage
# - Docker Container Build & Push to ACR with immutable $(Build.BuildId)
# - Publish Manifest Artifacts
# ===============================================================================
stages:
  - stage: BuildAndTest
    displayName: 'CI: Build, Test & Containerize'
    jobs:
      # -------------------------------------------------------------------------
      # Job 1: .NET 9 Backend Build & Automated Test Execution
      # -------------------------------------------------------------------------
      - job: Backend_CI
        displayName: 'Backend Build & Unit/Integration Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET Core SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'backend/EnterpriseUserManagement.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: 'backend/EnterpriseUserManagement.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Execute Automated Tests & Collect Coverage'
            inputs:
              command: 'test'
              projects: 'backend/EnterpriseUserManagement.sln'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage"'
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage Results'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
            condition: succeededOrFailed()

      # -------------------------------------------------------------------------
      # Job 2: Angular 19 Frontend Build & Verification
      # -------------------------------------------------------------------------
      - job: Frontend_CI
        displayName: 'Frontend Compile & Bundle Verification'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              npm ci
            displayName: 'Install Node Dependencies'
            workingDirectory: 'frontend/enterprise-user-management-ui'

          - script: |
              npm run build -- --configuration production
            displayName: 'Compile Angular Production Bundle'
            workingDirectory: 'frontend/enterprise-user-management-ui'

      # -------------------------------------------------------------------------
      # Job 3: Docker Images Build & Push to Azure Container Registry (ACR)
      # Runs only on push/merge to main after all quality tests pass
      # -------------------------------------------------------------------------
      - job: Container_Build_And_Push
        displayName: 'Build & Push Docker Images to ACR'
        dependsOn: [Backend_CI, Frontend_CI]
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        steps:
          - task: AzureCLI@2
            displayName: 'Build & Push Images to ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                echo "Authenticating Docker to ACR: $(acrName)..."
                az acr login --name $(acrName)

                echo "Building Backend Container Image..."
                docker build -t $(acrLoginServer)/eump-backend:$(tag) \
                             -t $(acrLoginServer)/eump-backend:latest \
                             -f backend/Dockerfile backend

                echo "Pushing Backend Container Image..."
                docker push $(acrLoginServer)/eump-backend:$(tag)
                docker push $(acrLoginServer)/eump-backend:latest

                echo "Building Frontend Container Image..."
                docker build -t $(acrLoginServer)/eump-frontend:$(tag) \
                             -t $(acrLoginServer)/eump-frontend:latest \
                             -f frontend/enterprise-user-management-ui/Dockerfile frontend/enterprise-user-management-ui

                echo "Pushing Frontend Container Image..."
                docker push $(acrLoginServer)/eump-frontend:$(tag)
                docker push $(acrLoginServer)/eump-frontend:latest

                echo "Container images pushed successfully with immutable tag $(tag) and latest."

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Kubernetes Manifests Artifact'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/kubernetes'
              artifact: 'manifests'

# ===============================================================================
# STAGE 2: CONTINUOUS DELIVERY - DEV ENVIRONMENT
# - Automatically deploys to dev namespace (eump-dev) upon successful CI build
# - Uses Development configuration (detailed logging, Swagger/Scalar enabled)
# ===============================================================================
  - stage: DeployToDev
    displayName: 'CD: Deploy to Dev Environment'
    dependsOn: BuildAndTest
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to Dev AKS Namespace'
        environment: 'eump-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'manifests'
                  displayName: 'Download Kubernetes Manifests'

                - task: AzureCLI@2
                  displayName: 'Deploy EUMP to Dev Environment'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      MANIFEST_DIR="$(Pipeline.Workspace)/manifests"
                      TARGET_NS="$(devNamespace)"

                      echo "Connecting kubectl to Dev AKS cluster $(devAksCluster)..."
                      az aks get-credentials --resource-group $(devResourceGroup) --name $(devAksCluster) --overwrite-existing

                      echo "1. Ensuring Namespace $TARGET_NS exists..."
                      kubectl create namespace $TARGET_NS --dry-run=client -o yaml | kubectl apply -f -

                      echo "2. Applying Dev Persistent Storage Claim..."
                      kubectl apply -f "$MANIFEST_DIR/01-storage.yaml" -n $TARGET_NS

                      echo "3. Applying Dev ConfigMap & Secret..."
                      kubectl apply -f "$MANIFEST_DIR/02-configmap-dev.yaml" -n $TARGET_NS
                      kubectl apply -f "$MANIFEST_DIR/03-secret.yaml" -n $TARGET_NS

                      echo "4. Deploying Backend with image $(acrLoginServer)/eump-backend:$(tag)..."
                      sed "s|image:\s*eump-backend:latest|image: $(acrLoginServer)/eump-backend:$(tag)|g" \
                        "$MANIFEST_DIR/04-backend-deployment.yaml" | kubectl apply -f - -n $TARGET_NS

                      echo "5. Applying Backend ClusterIP Service..."
                      kubectl apply -f "$MANIFEST_DIR/05-backend-service.yaml" -n $TARGET_NS

                      echo "6. Deploying Frontend with image $(acrLoginServer)/eump-frontend:$(tag) (Replicas: 1 for Dev)..."
                      sed -e "s|image:\s*eump-frontend:latest|image: $(acrLoginServer)/eump-frontend:$(tag)|g" \
                          -e "s|replicas:\s*2|replicas: 1|g" \
                        "$MANIFEST_DIR/06-frontend-deployment.yaml" | kubectl apply -f - -n $TARGET_NS

                      echo "7. Applying Frontend LoadBalancer Service..."
                      kubectl apply -f "$MANIFEST_DIR/07-frontend-service.yaml" -n $TARGET_NS

                      echo "8. Applying Ingress..."
                      kubectl apply -f "$MANIFEST_DIR/08-ingress.yaml" -n $TARGET_NS

                      echo "9. Applying Frontend Horizontal Pod Autoscaler (min: 1, max: 4 for Dev)..."
                      sed -e "s|minReplicas:\s*2|minReplicas: 1|g" \
                          -e "s|maxReplicas:\s*8|maxReplicas: 4|g" \
                        "$MANIFEST_DIR/09-frontend-hpa.yaml" | kubectl apply -f - -n $TARGET_NS

                      echo "Waiting for Dev Backend rollout..."
                      kubectl rollout status deployment/backend-deployment -n $TARGET_NS --timeout=180s

                      echo "Waiting for Dev Frontend rollout..."
                      kubectl rollout status deployment/frontend-deployment -n $TARGET_NS --timeout=180s

                      echo "Dev deployment succeeded! Dev Resources:"
                      kubectl get svc,pods,pvc,hpa -n $TARGET_NS

# ===============================================================================
# STAGE 3: CONTINUOUS DELIVERY - PROD ENVIRONMENT
# - Runs only after Dev deployment succeeds
# - Targets 'eump-prod' environment (requires approval gate in Azure DevOps)
# - Uses Production configuration (optimized logging, 2 frontend replicas for HA)
# ===============================================================================
  - stage: DeployToProd
    displayName: 'CD: Deploy to Production Environment'
    dependsOn: DeployToDev
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to Production AKS Namespace'
        environment: 'eump-prod'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'manifests'
                  displayName: 'Download Kubernetes Manifests'

                - task: AzureCLI@2
                  displayName: 'Deploy EUMP to Production Environment'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      MANIFEST_DIR="$(Pipeline.Workspace)/manifests"
                      TARGET_NS="$(prodNamespace)"

                      echo "Connecting kubectl to Production AKS cluster $(prodAksCluster)..."
                      az aks get-credentials --resource-group $(prodResourceGroup) --name $(prodAksCluster) --overwrite-existing

                      echo "1. Ensuring Namespace $TARGET_NS exists..."
                      kubectl create namespace $TARGET_NS --dry-run=client -o yaml | kubectl apply -f -

                      echo "2. Applying Production Persistent Storage Claim..."
                      kubectl apply -f "$MANIFEST_DIR/01-storage.yaml" -n $TARGET_NS

                      echo "3. Applying Production ConfigMap & Secret..."
                      kubectl apply -f "$MANIFEST_DIR/02-configmap-prod.yaml" -n $TARGET_NS
                      kubectl apply -f "$MANIFEST_DIR/03-secret.yaml" -n $TARGET_NS

                      echo "4. Deploying Backend with image $(acrLoginServer)/eump-backend:$(tag)..."
                      sed "s|image:\s*eump-backend:latest|image: $(acrLoginServer)/eump-backend:$(tag)|g" \
                        "$MANIFEST_DIR/04-backend-deployment.yaml" | kubectl apply -f - -n $TARGET_NS

                      echo "5. Applying Backend ClusterIP Service..."
                      kubectl apply -f "$MANIFEST_DIR/05-backend-service.yaml" -n $TARGET_NS

                      echo "6. Deploying Frontend with image $(acrLoginServer)/eump-frontend:$(tag) (Replicas: 2 for HA)..."
                      sed "s|image:\s*eump-frontend:latest|image: $(acrLoginServer)/eump-frontend:$(tag)|g" \
                        "$MANIFEST_DIR/06-frontend-deployment.yaml" | kubectl apply -f - -n $TARGET_NS

                      echo "7. Applying Frontend LoadBalancer Service..."
                      kubectl apply -f "$MANIFEST_DIR/07-frontend-service.yaml" -n $TARGET_NS

                      echo "8. Applying Ingress..."
                      kubectl apply -f "$MANIFEST_DIR/08-ingress.yaml" -n $TARGET_NS

                      echo "9. Applying Frontend Horizontal Pod Autoscaler (min: 2, max: 8 for Prod)..."
                      kubectl apply -f "$MANIFEST_DIR/09-frontend-hpa.yaml" -n $TARGET_NS

                      echo "Waiting for Production Backend rollout..."
                      kubectl rollout status deployment/backend-deployment -n $TARGET_NS --timeout=180s

                      echo "Waiting for Production Frontend rollout..."
                      kubectl rollout status deployment/frontend-deployment -n $TARGET_NS --timeout=180s

                      echo "Production deployment succeeded! Production Resources:"
                      kubectl get svc,pods,pvc,hpa -n $TARGET_NS
