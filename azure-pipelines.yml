# ===============================================================================
# Azure DevOps CI/CD Pipeline - Enterprise User Management Platform (EUMP)
# Target Architecture: 
#   - One Azure Subscription
#   - Shared Azure Container Registry (ACR)
#   - Dev Environment: AKS 'aks-eump-dev' (Namespace: 'dev')
#   - Prod Environment: AKS 'aks-eump-prod' (Namespace: 'prod')
# Standards: Multi-stage, Quality Gates, Immutable Build IDs, Manual Approval Gate for Prod
# ===============================================================================

name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
  paths:
    exclude:
      - README.md
      - docs/**
      - .vscode/**
      - .gitignore

pr:
  branches:
    include:
      - main

variables:
  # ---------------------------------------------------------------------------
  # Azure DevOps Service Connection & Shared Azure Resources
  # ---------------------------------------------------------------------------
  azureServiceConnection: 'azure-rm-connection' # ARM Service Connection name in Azure DevOps
  acrName: 'acreump100'                        # Shared Azure Container Registry name
  acrLoginServer: '$(acrName).azurecr.io'       # e.g., acreump100.azurecr.io

  # Dev Environment Target Settings (Cluster: aks-eump-dev, Namespace: dev)
  devResourceGroup: 'rg-eump-dev'               # Dev Azure Resource Group
  devAksCluster: 'aks-eump-dev'                 # Dev AKS Cluster name
  devNamespace: 'dev'                           # Isolated Dev Kubernetes Namespace
  devKeyVaultName: 'kv-eump-dev'               # Dev Azure Key Vault name

  # Prod Environment Target Settings (Cluster: aks-eump-prod, Namespace: prod)
  prodResourceGroup: 'rg-eump-prod'             # Prod Azure Resource Group
  prodAksCluster: 'aks-eump-prod'               # Prod AKS Cluster name
  prodNamespace: 'prod'                         # Isolated Prod Kubernetes Namespace
  prodKeyVaultName: 'kv-eump-prod'             # Prod Azure Key Vault name

  # Build Configuration
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'
  nodeVersion: '20.x'
  tag: '$(Build.BuildId)'                       # Immutable unique image tag per build

pool:
  vmImage: 'ubuntu-latest'

# ===============================================================================
# STAGE 1: CONTINUOUS INTEGRATION (CI)
# - Parallel Backend (.NET 9) and Frontend (Angular 19) Validation
# - Code Quality, Unit/Integration Tests Reporting & Coverage
# - Docker Container Build & Push to Shared ACR with immutable $(Build.BuildId)
# - Publish Kustomize Manifest Artifacts
# ===============================================================================
stages:
  - stage: BuildAndTest
    displayName: 'CI: Build, Test & Containerize'
    jobs:
      # -------------------------------------------------------------------------
      # Job 1: .NET 9 Backend Build & Automated Test Execution
      # -------------------------------------------------------------------------
      - job: Backend_CI
        displayName: 'Backend Build & Unit/Integration Tests'
        steps:
          - task: UseDotNet@2
            displayName: 'Install .NET Core SDK $(dotnetVersion)'
            inputs:
              packageType: 'sdk'
              version: '$(dotnetVersion)'

          - task: DotNetCoreCLI@2
            displayName: 'Restore NuGet Packages'
            inputs:
              command: 'restore'
              projects: 'backend/EnterpriseUserManagement.sln'

          - task: DotNetCoreCLI@2
            displayName: 'Build Solution ($(buildConfiguration))'
            inputs:
              command: 'build'
              projects: 'backend/EnterpriseUserManagement.sln'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: DotNetCoreCLI@2
            displayName: 'Execute Automated Tests & Collect Coverage'
            inputs:
              command: 'test'
              projects: 'backend/EnterpriseUserManagement.sln'
              arguments: '--configuration $(buildConfiguration) --no-build --logger trx --collect:"XPlat Code Coverage"'
              publishTestResults: true

          - task: PublishCodeCoverageResults@2
            displayName: 'Publish Code Coverage Results'
            inputs:
              summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
            condition: succeededOrFailed()

      # -------------------------------------------------------------------------
      # Job 2: Angular 19 Frontend Build & Verification
      # -------------------------------------------------------------------------
      - job: Frontend_CI
        displayName: 'Frontend Compile & Bundle Verification'
        steps:
          - task: NodeTool@0
            displayName: 'Install Node.js $(nodeVersion)'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: |
              npm ci
            displayName: 'Install Node Dependencies'
            workingDirectory: 'frontend/enterprise-user-management-ui'

          - script: |
              npm run build -- --configuration production
            displayName: 'Compile Angular Production Bundle'
            workingDirectory: 'frontend/enterprise-user-management-ui'

      # -------------------------------------------------------------------------
      # Job 3: Docker Images Build & Push to Shared Azure Container Registry (ACR)
      # Build ONCE, push immutable tag to shared ACR, deploy to both Dev and Prod
      # -------------------------------------------------------------------------
      - job: Container_Build_And_Push
        displayName: 'Build & Push Docker Images to Shared ACR'
        dependsOn: [Backend_CI, Frontend_CI]
        condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
        steps:
          - task: AzureCLI@2
            displayName: 'Build & Push Images to Shared ACR'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              inlineScript: |
                set -e
                echo "Authenticating Docker to shared ACR: $(acrName)..."
                ACR_TOKEN=$(az acr login --name $(acrName) --expose-token --output tsv --query accessToken 2>/dev/null || true)
                if [ -n "$ACR_TOKEN" ]; then
                  echo "$ACR_TOKEN" | docker login $(acrLoginServer) -u 00000000-0000-0000-0000-000000000000 --password-stdin
                else
                  az acr login --name $(acrName)
                fi

                echo "Building Backend Container Image..."
                docker build -t $(acrLoginServer)/eump-backend:$(tag) \
                             -f backend/Dockerfile backend

                echo "Pushing Backend Container Image..."
                docker push $(acrLoginServer)/eump-backend:$(tag)

                echo "Building Frontend Container Image..."
                docker build -t $(acrLoginServer)/eump-frontend:$(tag) \
                             -f frontend/enterprise-user-management-ui/Dockerfile frontend/enterprise-user-management-ui

                echo "Pushing Frontend Container Image..."
                docker push $(acrLoginServer)/eump-frontend:$(tag)

                echo "Container images pushed successfully with immutable tag $(tag)."

          - task: PublishPipelineArtifact@1
            displayName: 'Publish Helm Chart Artifact'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/charts'
              artifact: 'charts'

# ===============================================================================
# STAGE 2: CONTINUOUS DELIVERY - DEV ENVIRONMENT
# - Targets AKS Cluster: 'aks-eump-dev' (Namespace: 'dev')
# - Deploys via Helm Chart (charts/eump with values-dev.yaml)
# - Cost-effective resource allocations, Swagger enabled, Dev database & Key Vault
# ===============================================================================
  - stage: DeployToDev
    displayName: 'CD: Deploy to Dev Cluster (aks-eump-dev)'
    dependsOn: BuildAndTest
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployDev
        displayName: 'Deploy to aks-eump-dev (Namespace: dev)'
        environment: 'eump-dev'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'charts'
                  displayName: 'Download Helm Chart Artifact'

                - task: AzureCLI@2
                  displayName: 'Deploy to Dev AKS via Helm'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      CHART_DIR="$(Pipeline.Workspace)/charts/eump"
                      TARGET_NS="$(devNamespace)"

                      echo "Connecting kubectl and Helm to Dev AKS cluster $(devAksCluster)..."
                      az aks get-credentials --resource-group $(devResourceGroup) --name $(devAksCluster) --overwrite-existing

                      echo "Deploying Enterprise User Management Platform to $TARGET_NS via Helm..."
                      helm upgrade --install eump "$CHART_DIR" \
                        --namespace "$TARGET_NS" \
                        --create-namespace \
                        -f "$CHART_DIR/values.yaml" \
                        -f "$CHART_DIR/values-dev.yaml" \
                        --set backend.image.repository="$(acrLoginServer)/eump-backend" \
                        --set backend.image.tag="$(tag)" \
                        --set frontend.image.repository="$(acrLoginServer)/eump-frontend" \
                        --set frontend.image.tag="$(tag)" \
                        --set azureKeyVault.name="$(devKeyVaultName)" \
                        --take-ownership \
                        --force-conflicts \
                        --wait \
                        --timeout 5m

                      echo "Dev deployment succeeded! Deployed resources:"
                      kubectl get svc,pods,hpa,ingress -n "$TARGET_NS"

# ===============================================================================
# STAGE 3: CONTINUOUS DELIVERY - PROD ENVIRONMENT
# - Targets AKS Cluster: 'aks-eump-prod' (Namespace: 'prod')
# - Deploys via Helm Chart (charts/eump with values-prod.yaml)
# - Requires Manual Approval Gate configured on Azure DevOps Environment 'eump-prod'
# - High Availability: Multi-replica, PDB, Network Policies, Startup Probes, TLS Ingress
# ===============================================================================
  - stage: DeployToProd
    displayName: 'CD: Deploy to Production Cluster (aks-eump-prod)'
    dependsOn: DeployToDev
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    jobs:
      - deployment: DeployProduction
        displayName: 'Deploy to aks-eump-prod (Namespace: prod)'
        environment: 'eump-prod' # Configured with manual approval gate in Azure DevOps
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: 'charts'
                  displayName: 'Download Helm Chart Artifact'

                - task: AzureCLI@2
                  displayName: 'Deploy to Production AKS via Helm'
                  inputs:
                    azureSubscription: '$(azureServiceConnection)'
                    scriptType: 'bash'
                    scriptLocation: 'inlineScript'
                    inlineScript: |
                      set -e
                      CHART_DIR="$(Pipeline.Workspace)/charts/eump"
                      TARGET_NS="$(prodNamespace)"

                      echo "Connecting kubectl and Helm to Production AKS cluster $(prodAksCluster)..."
                      az aks get-credentials --resource-group $(prodResourceGroup) --name $(prodAksCluster) --overwrite-existing

                      echo "Deploying Enterprise User Management Platform to $TARGET_NS via Helm..."
                      helm upgrade --install eump "$CHART_DIR" \
                        --namespace "$TARGET_NS" \
                        --create-namespace \
                        -f "$CHART_DIR/values.yaml" \
                        -f "$CHART_DIR/values-prod.yaml" \
                        --set backend.image.repository="$(acrLoginServer)/eump-backend" \
                        --set backend.image.tag="$(tag)" \
                        --set frontend.image.repository="$(acrLoginServer)/eump-frontend" \
                        --set frontend.image.tag="$(tag)" \
                        --set azureKeyVault.name="$(prodKeyVaultName)" \
                        --take-ownership \
                        --force-conflicts \
                        --wait \
                        --timeout 6m

                      echo "Production deployment succeeded! Deployed resources:"
                      kubectl get svc,pods,hpa,ingress,pdb,networkpolicy -n "$TARGET_NS"
