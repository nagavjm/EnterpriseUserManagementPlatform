apiVersion: v1
kind: Secret
metadata:
  name: eump-secret
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/part-of: eump
type: Opaque
stringData:
  # Secret placeholders for non-vault fallback configuration (e.g. JWT secrets, API tokens)
  API_SECRET_KEY: "enterprise-user-management-secret-key-placeholder"
  # Fallback connection string: dynamically updated from Azure Key Vault by the Secrets Store CSI Driver
  ConnectionStrings__DefaultConnection: "Server=tcp:eump-sql-nagarajan.database.windows.net,1433;Initial Catalog=enterprise-user-db;Persist Security Info=False;User ID=sqladmin;Password=__REPLACED_BY_AZURE_KEY_VAULT__;MultipleActiveResultSets=False;Encrypt=True;TrustServerCertificate=False;Connection Timeout=30;"
