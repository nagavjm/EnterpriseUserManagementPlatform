apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: eump
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-deployment
  minReplicas: 1
  maxReplicas: 5
  metrics:
    # Scale aggressively on light load (e.g. 4 concurrent requests)
    # 10% of requested CPU (25m) = 2.5m CPU threshold
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 2
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # React to traffic immediately without delay
      selectPolicy: Max
      policies:
        - type: Pods
          value: 2 # Add 2 pods immediately when threshold breached
          periodSeconds: 10
        - type: Percent
          value: 100
          periodSeconds: 10
    scaleDown:
      stabilizationWindowSeconds: 120 # 2-minute stabilization window to allow observing scaled pods
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
