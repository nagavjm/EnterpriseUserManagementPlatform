apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: frontend-hpa
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eump
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: frontend-deployment
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Scale when average CPU utilization across pods exceeds 70% of requested CPU (50m)
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Scale when average Memory utilization exceeds 80% of requested Memory (64Mi)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # React to traffic spikes immediately
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
        - type: Pods
          value: 2
          periodSeconds: 15
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300 # 5-minute cool-down window to avoid pod thrashing
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
