apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: eump
  annotations:
    # Azure Load Balancer settings (uncomment if you wish to assign a DNS name or internal LB)
    # service.beta.kubernetes.io/azure-dns-label-name: "eump-demo"
    service.beta.kubernetes.io/azure-load-balancer-tcp-idle-timeout: "4"
spec:
  # In AKS, LoadBalancer automatically provisions an Azure Public Load Balancer and Public IP address.
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: enterprise-user-management-platform
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP

